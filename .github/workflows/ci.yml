name: CI

on:
  pull_request:
    branches: [main, "feat/cloudflare-workers-deployment"]
  push:
    branches: [main, "fix/security-hardening-*", "feat/cloudflare-workers-deployment", "grok/full-project-repair"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npm run build:worker
      - name: Build Cloud Run container
        run: docker build --tag mailcraft-ai:ci .
