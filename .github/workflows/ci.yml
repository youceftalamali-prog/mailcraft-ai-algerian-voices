name: CI

on:
  pull_request:
    branches: [main, "feat/cloudflare-workers-deployment", "grok/full-project-repair"]
  push:
    branches: [main, "fix/security-hardening-*", "feat/cloudflare-workers-deployment", "grok/full-project-repair", "fix/auth-*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailcraft_test
          POSTGRES_PASSWORD: mailcraft_test
          POSTGRES_DB: mailcraft_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailcraft_test -d mailcraft_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://mailcraft_test:mailcraft_test@localhost:5432/mailcraft_auth_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npm run build:worker
      - name: Validate Cloudflare Preview Worker bundle
        run: npm run build:worker:preview
      - name: Build Cloud Run container
        run: docker build --tag mailcraft-ai:ci .
