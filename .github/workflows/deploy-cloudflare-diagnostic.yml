name: Deploy Cloudflare Worker (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy diagnostic Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-workers-deployment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Worker bundle
        run: npm run build:worker

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret" && exit 1)

      - name: Deploy diagnostic Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test deployed Worker diagnostics
        shell: bash
        run: |
          set +e
          for endpoint in /api/health/runtime /api/health; do
            echo "===== GET ${endpoint} ====="
            curl --silent --show-error --max-time 30 --include "https://mailcraft-ai.youceftalamali.workers.dev${endpoint}"
            echo
          done
